name: Autonomous Dreamer

on:
  # This triggers the script every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # This allows us to run it manually from the "Actions" tab for testing
  workflow_dispatch:

jobs:
  dream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run the Dreamer
        run: python dreamer.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add DREAM_LOG.md
          # Only commit if there are actually changes to avoid empty commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Dream: Update Dream Log" && git push)
